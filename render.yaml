services:
  - type: web
    name: Danapi
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn projectname.wsgi:application"
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: my-db
          property: connectionString

databases:
  - name: my-db